<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg">
<title>Rapor Asistanı</title>
<style>
:root{--ink:#14213d;--bg:#eef1f4;--card:#fff;--ac:#0f766e;--mut:#5b6678;--line:#d5dbe3}
@media(prefers-color-scheme:dark){:root{--ink:#e8ecf3;--bg:#0f1624;--card:#18223a;--ac:#2dd4bf;--mut:#9aa6ba;--line:#2a3856}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
h2,h3{font-family:Georgia,serif;margin:.2em 0}
.wrap{max-width:760px;margin:auto;padding:12px 12px 80px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
nav button{white-space:nowrap;background:none;color:var(--mut);border:0;padding:8px 12px;border-radius:8px}
nav button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;margin:4px 0}
textarea{min-height:90px}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;margin:4px 4px 4px 0}
button.alt{background:none;color:var(--ac);border:1px solid var(--ac)}
.mut{color:var(--mut);font-size:14px}.err{color:#c0392b}.row{display:flex;gap:8px}.row>*{flex:1}
.box{max-width:340px;margin:12vh auto;padding:16px}
</style></head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
